name: Full Render

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Canonical project ID
        required: true
        type: string
      candidate_sha:
        description: Exact approved candidate commit SHA
        required: true
        type: string
      approved_proof_run_id:
        description: Human-approved proof workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  PROJECT_ID: ${{ inputs.project_id }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  APPROVED_PROOF_RUN_ID: ${{ inputs.approved_proof_run_id }}

jobs:
  full-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_PROOF_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Checkout exact approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          lfs: false

      - name: Download approved proof identity package
        uses: actions/download-artifact@v4
        with:
          name: orvyq-proof-${{ inputs.approved_proof_run_id }}
          path: approved-proof
          github-token: ${{ github.token }}
          run-id: ${{ inputs.approved_proof_run_id }}

      - name: Install media and repository asset tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git-lfs
          git lfs install --local
          git lfs pull
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked runtime and browser
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @remotion/cli@4.0.489
          npx remotion browser ensure

      - name: Locate approved proof manifest
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find approved-proof -type f -name proof_manifest.json -print -quit)"
          test -n "$MANIFEST"
          jq -e --arg project "$PROJECT_ID" --arg sha "$CANDIDATE_SHA" --arg run "$APPROVED_PROOF_RUN_ID" '.status == "TAMAMLANDI" and .project_id == $project and .candidate_sha == $sha and .proof_run_id == $run' "$MANIFEST"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Validate unchanged candidate
        run: npm run orvyq -- project:validate --project-id "$PROJECT_ID"

      - name: Render full film from approved candidate
        run: npm run orvyq -- full:render --project-id "$PROJECT_ID" --candidate-sha "$CANDIDATE_SHA" --approved-proof-run-id "$APPROVED_PROOF_RUN_ID" --proof-manifest-file "${{ steps.proof.outputs.manifest }}"

      - name: Verify final package
        run: |
          set -euo pipefail
          BASE="projects/$PROJECT_ID"
          test -s "$BASE/output/final.mp4"
          test -s "$BASE/output/final-contact-sheet.jpg"
          test -s "$BASE/build/final_manifest.json"
          test -s "$BASE/qa/rendered.full.json"
          jq -e --arg sha "$CANDIDATE_SHA" --arg run "$APPROVED_PROOF_RUN_ID" '.status == "TAMAMLANDI" and .candidate_sha == $sha and .approved_proof_run_id == $run' "$BASE/build/final_manifest.json"
          jq -e '.status == "TAMAMLANDI" and .minimum_yavg >= 18 and (.dark_brightness_samples | length) == 0 and (.transient_brightness_drops | length) == 0' "$BASE/qa/rendered.full.json"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$BASE/output/final.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$BASE/output/final.mp4"

      - name: Upload final film artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-final-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            projects/${{ inputs.project_id }}/output/final.mp4
            projects/${{ inputs.project_id }}/output/final-contact-sheet.jpg
            projects/${{ inputs.project_id }}/build/final_manifest.json
            projects/${{ inputs.project_id }}/qa/rendered.full.json
            projects/${{ inputs.project_id }}/qa/semantic_visual.json
            projects/${{ inputs.project_id }}/qa/pacing.json
            projects/${{ inputs.project_id }}/qa/mobile_legibility.json
            projects/${{ inputs.project_id }}/qa/music_cues.json
            projects/${{ inputs.project_id }}/audio/final_mix.metadata.json
            projects/${{ inputs.project_id }}/audio/audio_plan.json
            projects/${{ inputs.project_id }}/direction/production_plan.json
            projects/${{ inputs.project_id }}/direction/narration_timeline.json
            projects/${{ inputs.project_id }}/evidence/evidence_registry.json
