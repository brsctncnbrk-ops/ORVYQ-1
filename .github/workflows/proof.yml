name: Proof Render

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Canonical project ID
        required: true
        type: string
      candidate_sha:
        description: Exact prepared candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

env:
  PROJECT_ID: ${{ inputs.project_id }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          lfs: false

      - name: Install media and repository asset tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git-lfs
          git lfs install --local
          git lfs pull
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked runtime and browser
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @remotion/cli@4.0.489
          npx remotion browser ensure

      - name: Validate exact prepared candidate
        run: npm run orvyq -- project:validate --project-id "$PROJECT_ID"

      - name: Render canonical semantic proof prefix
        run: npm run orvyq -- proof:render --project-id "$PROJECT_ID" --candidate-sha "$CANDIDATE_SHA" --proof-run-id "$GITHUB_RUN_ID"

      - name: Verify proof package
        run: |
          set -euo pipefail
          BASE="projects/$PROJECT_ID"
          test -s "$BASE/output/proof.mp4"
          test -s "$BASE/output/proof-contact-sheet.jpg"
          test -s "$BASE/build/proof_manifest.json"
          test -s "$BASE/qa/rendered.proof.json"
          test -s "$BASE/qa/semantic_visual.json"
          test -s "$BASE/qa/pacing.json"
          test -s "$BASE/qa/mobile_legibility.json"
          test -s "$BASE/qa/music_cues.json"
          jq -e --arg sha "$CANDIDATE_SHA" --arg run "$GITHUB_RUN_ID" '.status == "TAMAMLANDI" and .candidate_sha == $sha and .proof_run_id == $run' "$BASE/build/proof_manifest.json"
          jq -e '.status == "TAMAMLANDI" and .minimum_yavg >= 18 and (.dark_brightness_samples | length) == 0 and (.transient_brightness_drops | length) == 0' "$BASE/qa/rendered.proof.json"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$BASE/output/proof.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$BASE/output/proof.mp4"

      - name: Upload proof review artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-proof-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            projects/${{ inputs.project_id }}/output/proof.mp4
            projects/${{ inputs.project_id }}/output/proof-contact-sheet.jpg
            projects/${{ inputs.project_id }}/build/proof_manifest.json
            projects/${{ inputs.project_id }}/build/candidate_inputs.json
            projects/${{ inputs.project_id }}/qa/candidate_preflight.json
            projects/${{ inputs.project_id }}/qa/rendered.proof.json
            projects/${{ inputs.project_id }}/qa/semantic_visual.json
            projects/${{ inputs.project_id }}/qa/pacing.json
            projects/${{ inputs.project_id }}/qa/mobile_legibility.json
            projects/${{ inputs.project_id }}/qa/music_cues.json
            projects/${{ inputs.project_id }}/audio/final_mix.metadata.json
            projects/${{ inputs.project_id }}/audio/audio_plan.json
            projects/${{ inputs.project_id }}/direction/production_plan.json
            projects/${{ inputs.project_id }}/direction/narration_timeline.json
            projects/${{ inputs.project_id }}/evidence/evidence_registry.json
