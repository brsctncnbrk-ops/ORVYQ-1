name: Proof Render

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Canonical project ID
        required: true
        type: string
      candidate_sha:
        description: Exact prepared candidate commit SHA
        required: true
        type: string
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER' &&
       contains(github.event.pull_request.body || '', '<!-- orvyq-proof project='))
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.resolve.outputs.project_id }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - name: Resolve immutable proof identity
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROJECT_ID: ${{ inputs.project_id }}
          DISPATCH_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            PROJECT_ID="$DISPATCH_PROJECT_ID"
            CANDIDATE_SHA="$DISPATCH_CANDIDATE_SHA"
          else
            COMMAND="$(printf '%s\n' "$PR_BODY" | grep -Eo '<!-- orvyq-proof project=[a-z0-9][a-z0-9-]{2,63} -->' | tail -n 1)"
            test -n "$COMMAND"
            PROJECT_ID="$(printf '%s' "$COMMAND" | sed -E 's/^<!-- orvyq-proof project=([^ ]+) -->$/\1/')"
            CANDIDATE_SHA="$PR_HEAD_SHA"
          fi
          [[ "$PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  proof:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PROJECT_ID: ${{ needs.resolve.outputs.project_id }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
          lfs: false

      - name: Install media and repository asset tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git-lfs
          git lfs install --local
          git lfs pull
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked runtime and browser
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @remotion/cli@4.0.489
          npx remotion browser ensure

      - name: Validate exact prepared candidate
        run: npm run orvyq -- project:validate --project-id "$PROJECT_ID"

      - name: Render canonical semantic proof prefix
        run: npm run orvyq -- proof:render --project-id "$PROJECT_ID" --candidate-sha "$CANDIDATE_SHA" --proof-run-id "$GITHUB_RUN_ID"

      - name: Verify proof package
        run: |
          set -euo pipefail
          BASE="projects/$PROJECT_ID"
          test -s "$BASE/output/proof.mp4"
          test -s "$BASE/output/proof-contact-sheet.jpg"
          test -s "$BASE/build/proof_manifest.json"
          test -s "$BASE/qa/rendered.proof.json"
          test -s "$BASE/qa/semantic_visual.json"
          test -s "$BASE/qa/pacing.json"
          test -s "$BASE/qa/mobile_legibility.json"
          test -s "$BASE/qa/music_cues.json"
          jq -e --arg sha "$CANDIDATE_SHA" --arg run "$GITHUB_RUN_ID" '.status == "TAMAMLANDI" and .candidate_sha == $sha and .proof_run_id == $run' "$BASE/build/proof_manifest.json"
          jq -e '.status == "TAMAMLANDI" and .minimum_yavg >= 18 and (.dark_brightness_samples | length) == 0 and (.transient_brightness_drops | length) == 0' "$BASE/qa/rendered.proof.json"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$BASE/output/proof.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$BASE/output/proof.mp4"

      - name: Package proof review artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE="projects/$PROJECT_ID"
          rm -rf proof-artifact
          mkdir -p proof-artifact
          cp --parents \
            "$BASE/output/proof.mp4" \
            "$BASE/output/proof-contact-sheet.jpg" \
            "$BASE/build/proof_manifest.json" \
            "$BASE/build/candidate_inputs.json" \
            "$BASE/qa/candidate_preflight.json" \
            "$BASE/qa/rendered.proof.json" \
            "$BASE/qa/semantic_visual.json" \
            "$BASE/qa/pacing.json" \
            "$BASE/qa/mobile_legibility.json" \
            "$BASE/qa/music_cues.json" \
            "$BASE/audio/final_mix.metadata.json" \
            "$BASE/audio/audio_plan.json" \
            "$BASE/direction/production_plan.json" \
            "$BASE/direction/narration_timeline.json" \
            "$BASE/evidence/evidence_registry.json" \
            proof-artifact/

      - name: Upload proof review artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-proof-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: proof-artifact
