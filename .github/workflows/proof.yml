name: Proof

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: projects/<project_id> candidate to render
        required: true
        type: string
      candidate_sha:
        description: Exact immutable 40-character candidate commit SHA
        required: true
        type: string
  push:
    branches: ['agent/orvyq-production-system']
    paths: ['proof_request.json']

permissions:
  contents: read

env:
  DISPATCH_PROJECT_ID: ${{ inputs.project_id }}
  DISPATCH_CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout request commit without implicit LFS download
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Resolve and validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PROJECT_ID="$DISPATCH_PROJECT_ID"
            CANDIDATE_SHA="$DISPATCH_CANDIDATE_SHA"
          else
            test -f proof_request.json
            PROJECT_ID="$(jq -r '.project_id' proof_request.json)"
            CANDIDATE_SHA="$(jq -r '.candidate_sha' proof_request.json)"
          fi
          [[ "$PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{2,79}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          git fetch origin "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Verify repository-owned LFS objects
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak git-lfs
          git lfs install --local
          git lfs pull --include="projects/$PROJECT_ID/assets/**"
          git lfs fsck

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and matching Remotion CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @remotion/cli@4.0.489
          npx remotion browser ensure

      - name: Re-run full frozen candidate preflight
        run: npm run orvyq -- validate --project-id "$PROJECT_ID" --frozen

      - name: Verify generic renderer with real audio/video smoke render
        run: npm run orvyq -- smoke

      - name: Render canonical semantic proof prefix and run rendered QA
        run: npm run orvyq -- proof --project-id "$PROJECT_ID" --candidate-sha "$CANDIDATE_SHA" --proof-run-id "$GITHUB_RUN_ID"

      - name: Verify proof MP4 streams and manifests
        shell: bash
        run: |
          set -euo pipefail
          PROOF="projects/$PROJECT_ID/output/proof.mp4"
          test -s "$PROOF"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$PROOF"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$PROOF"
          test -s "projects/$PROJECT_ID/build/proof_manifest.json"
          test -s "projects/$PROJECT_ID/output/proof-contact-sheet.jpg"

      - name: Upload proof review artifact only
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-proof-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            projects/*/output/proof.mp4
            projects/*/output/proof-contact-sheet.jpg
            projects/*/build/proof_manifest.json
            projects/*/qa/candidate_preflight.json
            projects/*/qa/rendered.proof.json
            projects/*/direction/production_plan.json
            projects/*/direction/narration_timeline.json
            projects/*/direction/captions.json