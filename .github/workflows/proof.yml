name: Proof

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: projects/<project_id> candidate to render
        required: true
        type: string
      candidate_sha:
        description: Exact immutable 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

env:
  PROJECT_ID: ${{ inputs.project_id }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{2,79}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact candidate without implicit LFS download
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          lfs: false

      - name: Verify exact checkout and repository-owned LFS objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak git-lfs
          git lfs install --local
          git lfs pull --include="projects/$PROJECT_ID/assets/**"
          git lfs fsck

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and matching Remotion CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @remotion/cli@4.0.489
          npx remotion browser ensure

      - name: Re-run full frozen candidate preflight
        run: npm run orvyq -- validate --project-id "$PROJECT_ID" --frozen

      - name: Verify generic renderer with real audio/video smoke render
        run: npm run orvyq -- smoke

      - name: Render canonical semantic proof prefix and run rendered QA
        run: npm run orvyq -- proof --project-id "$PROJECT_ID" --candidate-sha "$CANDIDATE_SHA" --proof-run-id "$GITHUB_RUN_ID"

      - name: Verify proof MP4 streams and manifests
        shell: bash
        run: |
          set -euo pipefail
          PROOF="projects/$PROJECT_ID/output/proof.mp4"
          test -s "$PROOF"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$PROOF"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$PROOF"
          test -s "projects/$PROJECT_ID/build/proof_manifest.json"
          test -s "projects/$PROJECT_ID/output/proof-contact-sheet.jpg"

      - name: Upload proof review artifact only
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-proof-${{ inputs.project_id }}-${{ inputs.candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            projects/${{ inputs.project_id }}/output/proof.mp4
            projects/${{ inputs.project_id }}/output/proof-contact-sheet.jpg
            projects/${{ inputs.project_id }}/build/proof_manifest.json
            projects/${{ inputs.project_id }}/qa/candidate_preflight.json
            projects/${{ inputs.project_id }}/qa/rendered.proof.json
            projects/${{ inputs.project_id }}/direction/production_plan.json
            projects/${{ inputs.project_id }}/direction/narration_timeline.json
            projects/${{ inputs.project_id }}/direction/captions.json
