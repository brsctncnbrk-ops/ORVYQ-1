name: Bootstrap First Film

on:
  pull_request:
    branches: [main]
    paths:
      - 'bootstrap/first-film.json'
      - '.github/workflows/bootstrap-first-film.yml'

permissions:
  contents: write

concurrency:
  group: orvyq-first-film-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout canonical rebuild branch
        uses: actions/checkout@v4
        with:
          ref: agent/orvyq-canonical-rebuild
          fetch-depth: 0
          lfs: false

      - name: Checkout approved raw assets from superseded branch
        uses: actions/checkout@v4
        with:
          repository: brsctncnbrk-ops/ORVYQ-1
          ref: agent/orvyq-production-system
          path: legacy-orvyq
          fetch-depth: 1
          lfs: true

      - name: Install deterministic media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils git-lfs curl
          git lfs install --local

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked canonical runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Initialize clean first-film project
        run: |
          set -euo pipefail
          test ! -e projects/001-ai-race
          npm run orvyq -- project:init --project-id 001-ai-race --title 'The AI Race No One Can Afford to Win' --minimum-duration-seconds 600
          mkdir -p projects/001-ai-race/evidence/primary projects/001-ai-race/assets/music

      - name: Capture genuine official document pages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            'https://www-cdn.anthropic.com/616dee633636e5bd309cb73aed8622e80fe47839.pdf' \
            --output /tmp/anthropic-rsp.pdf
          curl --fail --location --retry 5 --retry-all-errors \
            'https://storage.googleapis.com/deepmind-media/DeepMind.com/Blog/updating-the-frontier-safety-framework/Frontier%20Safety%20Framework%202.0.pdf' \
            --output /tmp/deepmind-fsf.pdf
          pdfinfo /tmp/anthropic-rsp.pdf >/dev/null
          pdfinfo /tmp/deepmind-fsf.pdf >/dev/null
          pdftoppm -f 1 -l 1 -singlefile -png -r 170 /tmp/anthropic-rsp.pdf projects/001-ai-race/evidence/primary/anthropic_rsp_cover
          pdftoppm -f 2 -l 2 -singlefile -png -r 170 /tmp/anthropic-rsp.pdf projects/001-ai-race/evidence/primary/anthropic_rsp_summary
          pdftoppm -f 7 -l 7 -singlefile -png -r 170 /tmp/anthropic-rsp.pdf projects/001-ai-race/evidence/primary/anthropic_rsp_thresholds
          pdftoppm -f 1 -l 1 -singlefile -png -r 170 /tmp/deepmind-fsf.pdf projects/001-ai-race/evidence/primary/deepmind_fsf_cover
          pdftoppm -f 2 -l 2 -singlefile -png -r 170 /tmp/deepmind-fsf.pdf projects/001-ai-race/evidence/primary/deepmind_fsf_framework
          pdftoppm -f 7 -l 7 -singlefile -png -r 170 /tmp/deepmind-fsf.pdf projects/001-ai-race/evidence/primary/deepmind_fsf_alignment

      - name: Download and verify official research figures
        shell: bash
        run: |
          set -euo pipefail
          base=projects/001-ai-race/evidence/primary
          curl --fail --location --retry 5 --retry-all-errors 'https://www-cdn.anthropic.com/images/4zrzovbb/website/246a928da96d21474848647bc4b0938d182aeb8b-4096x1746.png' -o "$base/anthropic_agentic_figure1.png"
          curl --fail --location --retry 5 --retry-all-errors 'https://www-cdn.anthropic.com/images/4zrzovbb/website/f8ade2db0fefac490af1e2a991b0d4ce3f0b238c-3840x2160.png' -o "$base/anthropic_agentic_figure2.png"
          curl --fail --location --retry 5 --retry-all-errors 'https://www-cdn.anthropic.com/images/4zrzovbb/website/f16473f9893693a59cb4794883ed0dce965ce93e-2514x1414.png' -o "$base/anthropic_agentic_figure3.png"
          curl --fail --location --retry 5 --retry-all-errors 'https://www-cdn.anthropic.com/images/4zrzovbb/website/d8889f94ef801509c36d02fabe7e61bd468ca6f6-3840x2160.png' -o "$base/anthropic_agentic_figure4.png"
          curl --fail --location --retry 5 --retry-all-errors 'https://www-cdn.anthropic.com/images/4zrzovbb/website/d4ecf930303d3c5b9bdb6d953fd845eac92ffb48-3840x2160.png' -o "$base/anthropic_agentic_figure5.png"
          curl --fail --location --retry 5 --retry-all-errors 'https://www-cdn.anthropic.com/images/4zrzovbb/website/a7c09ecd57c986788a20b71daaa533bc691830b3-4096x2304.png' -o "$base/anthropic_agentic_figure7.png"
          echo 'cfaecf0b38c18aa8192f0b57b50c93b6208125cd46be0458118831545b5ce98b  projects/001-ai-race/evidence/primary/anthropic_agentic_figure1.png' | sha256sum --check
          echo 'ee1906e24034c96d208955c27c4725d83fab598db28c694270ddad232236cc8c  projects/001-ai-race/evidence/primary/anthropic_agentic_figure2.png' | sha256sum --check
          echo '872eb01708bf45e01d3dcd00e4b0f39046c1f4234d6f2d7cf00f90fec9345f3b  projects/001-ai-race/evidence/primary/anthropic_agentic_figure3.png' | sha256sum --check
          echo 'ff0440f72c5e43ecef6bae1d069ec190fc23e2a6dddd811aa44b16977c7fb5a9  projects/001-ai-race/evidence/primary/anthropic_agentic_figure4.png' | sha256sum --check
          echo '96049e4f8be2fada996fc9bec734ec5ba446456474733c15b1ee9b1fb5c146d8  projects/001-ai-race/evidence/primary/anthropic_agentic_figure5.png' | sha256sum --check
          echo 'a4c05c2fd1dff329a4930221e959ee8b4960288e6ffeb113cb8a4df360d93cbe  projects/001-ai-race/evidence/primary/anthropic_agentic_figure7.png' | sha256sum --check

      - name: Download and verify approved licensed music
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors \
            --user-agent 'ORVYQ canonical documentary renderer/1.0' \
            --referer 'https://www.scottbuckley.com.au/library/signal-to-noise/' \
            'https://www.scottbuckley.com.au/library/wp-content/uploads/2020/04/sb_signaltonoise.mp3' \
            --output projects/001-ai-race/assets/music/signal-to-noise.mp3
          echo '47a2f15ecd65f1d7ef0418ee17ae31f4e724bdf73b2c2838aaa39ac1703d094e  projects/001-ai-race/assets/music/signal-to-noise.mp3' | sha256sum --check
          test "$(stat -c %s projects/001-ai-race/assets/music/signal-to-noise.mp3)" = '14143939'

      - name: Build canonical first-film contracts
        run: node scripts/bootstrap-first-film.mjs --phase=prepare --legacy-root="$GITHUB_WORKSPACE/legacy-orvyq/projects/001-ai-race"

      - name: Build deterministic final audio mix
        shell: bash
        run: |
          set -o pipefail
          npm run orvyq -- audio:mix --project-id 001-ai-race 2>&1 | tee bootstrap-audio.log

      - name: Register mix and validate complete project
        run: |
          set -euo pipefail
          node scripts/bootstrap-first-film.mjs --phase=finalize --legacy-root="$GITHUB_WORKSPACE/legacy-orvyq/projects/001-ai-race"
          npm run orvyq -- project:validate --project-id 001-ai-race
          npm run orvyq -- candidate:prepare --project-id 001-ai-race

      - name: Commit self-contained first film
        shell: bash
        run: |
          set -o pipefail
          rm -rf legacy-orvyq
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git lfs install --local
          {
            git restore --worktree --staged tests/fixtures/pixel.png || true
            git status --short
            git add projects/001-ai-race
            git lfs fsck
            git commit -m 'Bootstrap canonical first film from approved raw assets'
            git fetch origin agent/orvyq-canonical-rebuild
            git rebase origin/agent/orvyq-canonical-rebuild
            git lfs push --all origin HEAD
            git push origin HEAD:agent/orvyq-canonical-rebuild
          } 2>&1 | tee bootstrap-push.log

      - name: Upload bootstrap audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-first-film-bootstrap-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            bootstrap-audio.log
            bootstrap-push.log
            projects/001-ai-race/qa/candidate_preflight.json
            projects/001-ai-race/build/candidate_inputs.json
            projects/001-ai-race/audio/final_mix.metadata.json
            projects/001-ai-race/research/source_catalog.json
            projects/001-ai-race/research/claim_registry.json
            projects/001-ai-race/evidence/evidence_registry.json
            projects/001-ai-race/assets/asset_registry.json
            projects/001-ai-race/direction/narration_timeline.json
            projects/001-ai-race/direction/production_plan.json
