name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository without implicit LFS download
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install system media tools and Git LFS
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak git-lfs
          git lfs install --local
          git lfs pull
          git lfs fsck

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install matching Remotion CLI without changing lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @remotion/cli@4.0.489

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Validate CLI contracts and repository boundaries
        run: npm run typecheck

      - name: Type-check generic Remotion renderer
        run: npm run typecheck:render

      - name: Run invariant and negative tests
        run: npm test

      - name: Render real audio/video smoke fixture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run orvyq -- smoke 2>&1 | tee artifacts/smoke-command.log

      - name: Verify smoke artifact with FFprobe
        run: |
          set -euo pipefail
          test -s artifacts/smoke.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 artifacts/smoke.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 artifacts/smoke.mp4
          test -s artifacts/smoke-qa.json

      - name: Upload CI media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-ci-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/smoke-command.log
            artifacts/smoke.mp4
            artifacts/smoke-qa.json

  one-time-proof:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[proof-request]'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout proof request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Resolve frozen proof candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f proof_request.json
          PROJECT_ID="$(jq -r '.project_id' proof_request.json)"
          CANDIDATE_SHA="$(jq -r '.candidate_sha' proof_request.json)"
          [[ "$PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{2,79}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          git fetch origin "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install system media tools and repository-owned LFS assets
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak git-lfs
          git lfs install --local
          git lfs pull --include="projects/$PROJECT_ID/assets/**"
          git lfs fsck

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and matching Remotion CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @remotion/cli@4.0.489
          npx remotion browser ensure

      - name: Validate frozen full-film candidate
        run: npm run orvyq -- validate --project-id "$PROJECT_ID" --frozen

      - name: Render canonical proof prefix
        run: npm run orvyq -- proof --project-id "$PROJECT_ID" --candidate-sha "$CANDIDATE_SHA" --proof-run-id "$GITHUB_RUN_ID"

      - name: Verify proof artifact
        shell: bash
        run: |
          set -euo pipefail
          PROOF="projects/$PROJECT_ID/output/proof.mp4"
          test -s "$PROOF"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$PROOF"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$PROOF"
          test -s "projects/$PROJECT_ID/build/proof_manifest.json"
          test -s "projects/$PROJECT_ID/output/proof-contact-sheet.jpg"

      - name: Upload real proof review artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-proof-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            projects/*/output/proof.mp4
            projects/*/output/proof-contact-sheet.jpg
            projects/*/build/proof_manifest.json
            projects/*/qa/candidate_preflight.json
            projects/*/qa/rendered.proof.json
            projects/*/direction/production_plan.json
            projects/*/direction/narration_timeline.json
            projects/*/direction/captions.json